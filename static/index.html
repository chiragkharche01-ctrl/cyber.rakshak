<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberRakshak - Website Security Assessment</title>
<style>
:root{--bg:#0a1424;--sf:#111d33;--sf2:#16253f;--bd:#233250;--tx:#e6edf7;--mu:#93a4bf;--ac:#2dd4bf;--acd:#0f766e;--red:#ef4444;--org:#f97316;--amb:#f59e0b;--blu:#3b82f6;--sl:#64748b;--grn:#22c55e;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
[data-theme=light]{--bg:#f3f6fb;--sf:#fff;--sf2:#eef2f8;--bd:#d8e0ec;--tx:#0f1b2e;--mu:#53637d;--ac:#0d9488;--acd:#0f766e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);line-height:1.55}a{color:var(--ac);text-decoration:none}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}.mu{color:var(--mu)}.sm{font-size:.86rem}
button,input,select{font:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#04211d;border:0;border-radius:9px;padding:.6rem 1.1rem;font-weight:600;cursor:pointer;display:inline-block}.btn:hover{filter:brightness(1.08)}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.d{background:transparent;color:var(--red);border:1px solid var(--red)}.btn.s{padding:.3rem .7rem;font-size:.85rem}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{width:100%;background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:.65rem .8rem}label{display:block;font-weight:600;margin:.9rem 0 .3rem;font-size:.9rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:1.2rem}.grid{display:grid;gap:1rem}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.2rem}.pnav{display:flex;justify-content:space-between;align-items:center;padding:1rem 0}.logo{font-weight:800;font-size:1.2rem;color:var(--tx)}.logo b{color:var(--ac)}
.hero{padding:4.5rem 0 3rem;max-width:760px}.hero h1{font-size:clamp(2rem,5vw,3.4rem)}.hero p{font-size:1.1rem;color:var(--mu)}.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
section.l{padding:2.5rem 0}.step{display:flex;gap:.9rem}.step i{font-style:normal;flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--sf2);border:1px solid var(--ac);display:grid;place-items:center;font-weight:700;color:var(--ac)}
details{border-bottom:1px solid var(--bd);padding:.8rem 0}summary{cursor:pointer;font-weight:600}footer{border-top:1px solid var(--bd);padding:1.5rem 0;margin-top:2rem;color:var(--mu);font-size:.85rem}
.shell{display:flex;min-height:100vh}.side{width:230px;background:var(--sf);border-right:1px solid var(--bd);padding:1.2rem .8rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.2rem;flex:none}.side a,.side button{display:block;padding:.55rem .8rem;border-radius:8px;color:var(--mu);background:none;border:0;text-align:left;cursor:pointer;width:100%}.side a.on,.side a:hover,.side button:hover{background:var(--sf2);color:var(--tx)}.side .grp{font-size:.75rem;color:var(--mu);margin:.9rem .8rem .2rem}
.main{flex:1;padding:1.6rem;min-width:0;max-width:1100px}.top{display:none;align-items:center;justify-content:space-between;margin-bottom:1rem}
@media(max-width:800px){.side{position:fixed;left:-250px;z-index:5;transition:.2s}.side.open{left:0}.top{display:flex}.main{padding:1rem}}
.b{display:inline-block;border-radius:6px;padding:.1rem .5rem;font-size:.75rem;font-weight:700;color:#fff;white-space:nowrap}.b.CRITICAL{background:var(--red)}.b.HIGH{background:var(--org)}.b.MEDIUM{background:var(--amb);color:#201400}.b.LOW{background:var(--blu)}.b.INFO{background:var(--sl)}.b.PASS{background:var(--grn);color:#052e16}.b.WARN{background:var(--amb);color:#201400}.b.FAIL{background:var(--red)}.b.ERROR{background:var(--sl)}.b.QUEUED,.b.RUNNING{background:var(--blu)}.b.COMPLETED{background:var(--grn);color:#052e16}.b.FAILED{background:var(--red)}.b.MODERATE{background:var(--amb);color:#201400}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.65rem .6rem;border-bottom:1px solid var(--bd);font-size:.92rem}th{color:var(--mu);font-weight:600}.tw{overflow-x:auto}
.stat{font-size:1.7rem;font-weight:700}.bar{height:8px;background:var(--sf2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.find{border:1px solid var(--bd);border-radius:12px;margin:.6rem 0;background:var(--sf)}.find>summary{padding:.8rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.find .bd{padding:0 1rem 1rem;font-size:.92rem}.find .bd p{margin:.5rem 0}.find code{display:block;background:var(--sf2);padding:.5rem;border-radius:6px;overflow-wrap:anywhere;font-size:.82rem}
.err{background:#7f1d1d33;border:1px solid var(--red);color:var(--tx);padding:.7rem 1rem;border-radius:9px;margin:.8rem 0}.demo{background:#78350f44;border:1px solid var(--amb);padding:.6rem 1rem;border-radius:9px;margin-bottom:1rem;font-weight:600}
.sk{height:70px;border-radius:12px;background:linear-gradient(90deg,var(--sf) 25%,var(--sf2) 50%,var(--sf) 75%);background-size:200% 100%;animation:s 1.4s infinite}@keyframes s{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.auth{max-width:400px;margin:4rem auto}.empty{text-align:center;padding:2rem;color:var(--mu)}.chk{display:flex;gap:.6rem;align-items:flex-start;font-weight:400;margin-top:1rem}.chk input{width:auto;margin-top:.3rem}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9}.modal .card{max-width:380px}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app');let token=localStorage.getItem('cr_t'),user=null,poll=null,thm=localStorage.getItem('cr_th')||'dark';document.documentElement.dataset.theme=thm;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>s?new Date(s).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'-';
async function api(p,o={}){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
 const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
 if(o.blob&&r.ok)return r.blob();let j={};try{j=await r.json()}catch(e){}
 if(r.status===401&&token&&!p.startsWith('/auth')){token=null;localStorage.removeItem('cr_t');location.hash='#/login'}
 if(!j.success)throw new Error(j.error?.message||'Request failed. Please try again.');return j.data}
const $=s=>document.querySelector(s);const on=(s,e,f)=>{const n=$(s);if(n)n.addEventListener(e,f)};
const sevOrd={CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3,INFO:4},stOrd={FAIL:0,WARN:1,ERROR:2,PASS:3};
const col=s=>s>=85?'var(--grn)':s>=65?'var(--amb)':s>=45?'var(--org)':'var(--red)';
const ring=(s,lab)=>{const r=52,c=2*Math.PI*r;return`<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Score ${s} of 100"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--sf2)" stroke-width="11"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${col(s)}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c*s/100} ${c}" transform="rotate(-90 70 70)"/><text x="70" y="68" text-anchor="middle" font-size="34" font-weight="700" fill="var(--tx)">${s}</text><text x="70" y="88" text-anchor="middle" font-size="12" fill="var(--mu)">/100 ${esc(lab||'')}</text></svg>`};
function trend(pts){if(pts.length<2)return'<p class="mu sm">Run at least two assessments to see a trend.</p>';const w=600,h=160,p=26,x=i=>p+i*(w-2*p)/(pts.length-1),y=v=>h-p-v*(h-2*p)/100;
 return`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Security score over time">${[0,50,100].map(v=>`<line x1="${p}" x2="${w-p}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="2" y="${y(v)+4}" font-size="10" fill="var(--mu)">${v}</text>`).join('')}<polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map((q,i)=>x(i)+','+y(q.score)).join(' ')}"/>${pts.map((q,i)=>`<circle cx="${x(i)}" cy="${y(q.score)}" r="4" fill="var(--ac)"><title>${esc(q.domain)}: ${q.score} (${dt(q.date)})</title></circle>`).join('')}</svg>`}
const sk='<div class="grid g4"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
function toast(m){alert(m)}
function confirmBox(msg,fn){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h3>${esc(msg)}</h3><p class="mu">This action cannot be undone.</p><div class="row"><button class="btn d" id="cy">Delete</button><button class="btn g" id="cn">Cancel</button></div></div>`;document.body.append(m);m.querySelector('#cn').onclick=()=>m.remove();m.querySelector('#cy').onclick=async()=>{m.remove();try{await fn()}catch(e){toast(e.message)}route()}}

/* ---------- public pages ---------- */
const pnav=()=>`<nav class="pnav wrap"><a class="logo" href="#/">Cyber<b>Rakshak</b></a><div class="row">${token?'<a class="btn s" href="#/dashboard">Dashboard</a>':'<a class="btn g s" href="#/login">Sign in</a><a class="btn s" href="#/register">Create account</a>'}</div></nav>`;
const foot='<footer><div class="wrap">CyberRakshak is a college project. It performs passive, low-impact security posture assessments and is not a penetration-testing tool. Only scan systems you own or are authorized to assess.</div></footer>';
function landing(){app.innerHTML=`${pnav()}<main class="wrap"><div class="hero"><h1>Understand your website's security before attackers do.</h1><p>CyberRakshak performs a simple, understandable security assessment of your public-facing website and turns technical findings into actionable recommendations.</p><div class="row"><a class="btn" href="${token?'#/scan':'#/register'}">Start Security Assessment</a><a class="btn g" href="#/demo">View Demo</a></div></div>
<section class="l"><h2>How it works</h2><div class="grid g2"><div class="step"><i>1</i><div><b>Enter your domain</b><br><span class="mu">and confirm you are authorized to assess it.</span></div></div><div class="step"><i>2</i><div><b>Real checks run</b><br><span class="mu">HTTPS, TLS, headers, cookies, DNS and more, with live progress.</span></div></div><div class="step"><i>3</i><div><b>Get a score and fixes</b><br><span class="mu">Every finding has evidence and a practical remediation.</span></div></div><div class="step"><i>4</i><div><b>Download the PDF</b><br><span class="mu">A professional report built from your actual scan data.</span></div></div></div></section>
<section class="l"><h2>Security checks</h2><div class="grid g4">${['HTTPS and redirects','TLS certificate validity and expiry','CSP, HSTS and 6 more headers','Cookie Secure, HttpOnly, SameSite','DNS, SPF, DMARC, CAA','Server information disclosure','robots.txt and security.txt','Technology clues and HTTP methods'].map(t=>`<div class="card sm">${t}</div>`).join('')}</div></section>
<section class="l"><h2>Risk scoring and reports</h2><p class="mu" style="max-width:700px">Findings are weighted by severity (Low 2, Medium 5, High 10, Critical 20) and normalized against the checks that actually ran, giving a transparent 0-100 score. Results are saved so you can track improvement over time.</p></section>
<section class="l"><h2>Why CyberRakshak</h2><p class="mu" style="max-width:700px">Cybersecurity without needing a cybersecurity expert. Built for small businesses, students, clinics and colleges. Honest by design: a clean result means no issues were found by the checks performed, never "100% secure".</p></section>
<section class="l"><h2>FAQ</h2><details><summary>Does it hack my website?</summary><p class="mu">No. It only reads public information: headers, certificate, DNS records and standard files. No exploitation, brute force or port scanning.</p></details><details><summary>Is it a penetration testing tool?</summary><p class="mu">No. It is a passive security-posture assessment with an architecture that can be extended later.</p></details><details><summary>Can I scan any website?</summary><p class="mu">Only domains you own or have permission to assess. Scans require an authorization confirmation, which is saved with the record.</p></details></section></main>${foot}`}
function authPage(reg){app.innerHTML=`${pnav()}<main class="auth card"><h2>${reg?'Create your account':'Welcome back'}</h2><div id="e"></div><form id="f">${reg?'<label for="n">Full name</label><input id="n" required autocomplete="name">':''}<label for="m">Email</label><input id="m" type="email" required autocomplete="email"><label for="p">Password</label><input id="p" type="password" required minlength="8" autocomplete="${reg?'new':'current'}-password"><p><button class="btn" style="width:100%">${reg?'Create account':'Sign in'}</button></p></form><p class="mu sm">${reg?'Have an account? <a href="#/login">Sign in</a>':'New here? <a href="#/register">Create an account</a>'}</p></main>`;
 on('#f','submit',async ev=>{ev.preventDefault();$('#e').innerHTML='';try{const em=$('#m').value,pw=$('#p').value;if(reg){await api('/auth/register',{method:'POST',body:{email:em,password:pw,full_name:$('#n').value}})}
  const d=await api('/auth/login',{method:'POST',body:{email:em,password:pw}});token=d.token;localStorage.setItem('cr_t',token);user=d.user;location.hash='#/dashboard'}catch(e){$('#e').innerHTML=`<div class="err" role="alert">${esc(e.message)}</div>`}})}

/* ---------- result view (shared by real + demo) ---------- */
function findCard(c){return`<details class="find"><summary><span class="b ${c.status}">${c.status}</span><span class="b ${c.severity}">${c.severity}</span><b>${esc(c.name)}</b><span class="mu sm">${esc(c.summary)}</span></summary><div class="bd"><p><b>Why it matters:</b> ${esc(c.description||'-')}</p><p><b>Evidence:</b></p><code>${esc(c.evidence||'-')}</code>${c.recommendation?`<p><b>How to fix:</b> ${esc(c.recommendation)}</p>`:''}${c.reference_url?`<p class="sm"><b>Reference:</b> <a href="${esc(c.reference_url)}" target="_blank" rel="noopener noreferrer">${esc(c.reference_url)}</a></p>`:''}<p class="mu sm">${esc(c.category)} - ${c.duration_ms} ms</p></div></details>`}
function result(s,demo){const cs=s.checks;const delta=s.previous_score!=null?s.overall_score-s.previous_score:null;const crit=cs.filter(c=>c.status==='FAIL'&&c.severity==='CRITICAL').length;
 app.querySelector('#view').innerHTML=`${demo?'<div class="demo">DEMO DATA - this is a pre-generated sample, not a real scan.</div>':''}<div class="row" style="justify-content:space-between"><div><h1>Security Assessment</h1><p class="mu">${esc(s.domain)} - ${dt(s.completed_at)}</p></div>${demo?'':`<button class="btn" id="pdf">Download PDF Report</button>`}</div>
 <div class="grid g2" style="margin:1rem 0"><div class="card row" style="gap:1.5rem">${ring(s.overall_score,s.label)}<div><div class="mu sm">Risk level</div><span class="b ${s.risk_level}" style="font-size:1rem">${s.risk_level}</span>${delta!=null?`<p class="sm">${delta>0?'+':''}${delta} points vs previous assessment${delta>0?' - improved':delta<0?' - declined':''}.</p>`:''}<p class="sm mu">Your assessment found ${s.warning_checks+s.failed_checks} area(s) that need attention.</p></div></div>
 <div class="grid g4" style="grid-template-columns:repeat(2,1fr)">${[['Checks',s.total_checks],['Passed',s.passed_checks],['Warnings',s.warning_checks],['Failed',s.failed_checks],['Critical',crit]].map(([a,b])=>`<div class="card"><div class="mu sm">${a}</div><div class="stat">${b}</div></div>`).join('')}</div></div>
 <div class="card"><h3>Category scores</h3>${s.categories.map(c=>`<div style="margin:.6rem 0"><div class="row" style="justify-content:space-between"><span>${esc(c.category)}</span><span class="mu sm">${c.passed} passed, ${c.warnings} warn, ${c.failed} failed - ${c.score}%</span></div><div class="bar"><i style="width:${c.score}%;background:${col(c.score)}"></i></div></div>`).join('')}</div>
 <div class="row" style="margin:1.2rem 0 .3rem"><h2 style="margin:0;flex:1">Findings</h2><select id="fl" style="width:auto" aria-label="Filter"><option value="">All</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option value="PASS">Passed</option></select><select id="so" style="width:auto" aria-label="Sort"><option value="sev">Sort: Severity</option><option value="cat">Sort: Category</option><option value="st">Sort: Status</option></select></div><div id="fs"></div>
 <p class="mu sm" style="margin-top:1.5rem">This automated assessment evaluates only the checks performed by CyberRakshak during the stated assessment period. A clean result does not guarantee that the target is completely secure. Only authorized systems should be assessed.</p>`;
 const draw=()=>{const f=$('#fl').value,o=$('#so').value;let l=cs.filter(c=>!f||(f==='PASS'?c.status==='PASS':c.severity===f&&c.status!=='PASS'));
  l.sort((a,b)=>o==='cat'?a.category.localeCompare(b.category):o==='st'?stOrd[a.status]-stOrd[b.status]||sevOrd[a.severity]-sevOrd[b.severity]:stOrd[a.status]-stOrd[b.status]||sevOrd[a.severity]-sevOrd[b.severity]);
  $('#fs').innerHTML=l.map(findCard).join('')||'<div class="empty">No findings match this filter.</div>'};draw();on('#fl','change',draw);on('#so','change',draw);
 on('#pdf','click',()=>dl(s.id))}
async function dl(sid){try{let rs=await api('/reports');let r=rs.find(x=>x.scan_id===sid);if(!r){const g=await api(`/scans/${sid}/report`,{method:'POST'});r={id:g.id}}await dlReport(r.id)}catch(e){toast(e.message)}}
async function dlReport(id){let b;try{b=await api(`/reports/${id}/download`,{blob:true})}catch(e){const s=(await api('/reports')).find(x=>x.id===id);const g=await api(`/scans/${s.scan_id}/report`,{method:'POST'});id=g.id;b=await api(`/reports/${id}/download`,{blob:true})}
 const r=await api('/reports/'+id);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`CyberRakshak-${r.domain.replace(/\./g,'-')}-${r.completed_at.slice(0,10)}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ---------- app pages ---------- */
const nav=[['dashboard','Dashboard'],['scan','New Assessment'],['targets','My Targets'],['reports','Reports'],['history','Scan History'],['profile','Profile'],['settings','Settings']];
function shell(cur){app.innerHTML=`<div class="shell"><aside class="side" id="sd"><a class="logo" href="#/" style="padding:.4rem .8rem 1rem">Cyber<b>Rakshak</b></a>${nav.map(([k,l],i)=>(i===4?'<div class="grp">Security</div>':i===5?'<div class="grp">Account</div>':i===0?'':'')+`<a href="#/${k}" class="${cur===k?'on':''}">${l}</a>`).join('')}<button id="lo">Logout</button></aside><main class="main"><div class="top"><a class="logo" href="#/">Cyber<b>Rakshak</b></a><button class="btn g s" id="mb" aria-label="Menu">Menu</button></div><div id="view">${sk}</div></main></div>`;
 on('#mb','click',()=>$('#sd').classList.toggle('open'));on('#sd','click',e=>{if(e.target.tagName==='A')$('#sd').classList.remove('open')});on('#lo','click',async()=>{try{await api('/auth/logout',{method:'POST'})}catch(e){}token=null;localStorage.removeItem('cr_t');location.hash='#/'})}
const V=h=>{$('#view').innerHTML=h};const fail=e=>V(`<div class="err" role="alert">${esc(e.message)}</div>`);
const scanRows=l=>`<div class="tw"><table><thead><tr><th>Domain</th><th>Score</th><th>Risk</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>${l.map(s=>`<tr><td>${esc(s.domain)}</td><td>${s.overall_score??'-'}</td><td>${s.risk_level?`<span class="b ${s.risk_level}">${s.risk_level}</span>`:'-'}</td><td>${dt(s.created_at)}</td><td><span class="b ${s.status}">${s.status}</span></td><td><a class="btn g s" href="#/scan/${s.id}">View Report</a></td></tr>`).join('')}</tbody></table></div>`;
async function dashboard(){shell('dashboard');try{const d=await api('/dashboard'),h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',L=d.latest;
 V(`<h1>${g}, ${esc((user.full_name||'').split(' ')[0])}</h1><p class="mu">Here's your security overview.</p>${!d.total_scans?`<div class="card empty"><h3>No assessments yet.</h3><p>Run your first security assessment to see your security posture.</p><a class="btn" href="#/scan">Start Assessment</a></div>`:`
 <div class="grid g4"><div class="card"><div class="mu sm">Security score</div><div class="stat" style="color:${L?col(L.overall_score):''}">${L?L.overall_score+' / 100':'-'}</div><div class="sm">${L?esc(L.domain):''}${d.previous_score!=null&&L?` <b>(${L.overall_score-d.previous_score>=0?'+':''}${L.overall_score-d.previous_score} vs previous)</b>`:''}</div></div><div class="card"><div class="mu sm">Risk level</div><div class="stat">${L?L.risk_level:'-'}</div></div><div class="card"><div class="mu sm">Total scans</div><div class="stat">${d.total_scans}</div></div><div class="card"><div class="mu sm">Critical issues</div><div class="stat">${L?L.critical_count:0}</div></div><div class="card"><div class="mu sm">High issues</div><div class="stat">${L?L.high_count:0}</div></div><div class="card"><div class="mu sm">Last scan</div><div class="sm" style="margin-top:.6rem">${dt(d.recent[0].created_at)}</div></div></div>
 <div class="grid g2" style="margin-top:1rem"><div class="card"><h3>Security trend</h3>${trend(d.trend)}</div><div class="card"><h3>Security overview</h3>${d.categories.map(c=>`<div style="margin:.5rem 0"><div class="row" style="justify-content:space-between"><span class="sm">${esc(c.category)}</span><span class="mu sm">${c.score}%</span></div><div class="bar"><i style="width:${c.score}%;background:${col(c.score)}"></i></div></div>`).join('')||'<p class="mu">No data</p>'}</div></div>
 <div class="card" style="margin-top:1rem"><h3>Recent assessments</h3>${scanRows(d.recent)}</div>`}`)}catch(e){fail(e)}}
function scanForm(){shell('scan');V(`<h1>New assessment</h1><p class="mu">CyberRakshak runs passive, non-destructive checks on a public website.</p><div class="card" style="max-width:560px"><div id="e"></div><div class="demo" style="font-weight:400">Only scan websites and systems that you own or are explicitly authorized to assess.</div><form id="f"><label for="d">Target domain</label><input id="d" placeholder="example.com" required autocomplete="off"><label for="t">Scan type</label><select id="t"><option>Website Security Assessment</option></select><label class="chk"><input type="checkbox" id="a"><span>I confirm that I own or have authorization to assess this domain.</span></label><p><button class="btn" id="go" disabled>Start Assessment</button></p></form></div>`);
 on('#a','change',e=>$('#go').disabled=!e.target.checked);on('#f','submit',async ev=>{ev.preventDefault();$('#go').disabled=true;try{const r=await api('/scans',{method:'POST',body:{domain:$('#d').value,authorized:$('#a').checked}});location.hash='#/scan/'+r.id}catch(e){$('#e').innerHTML=`<div class="err" role="alert">${esc(e.message)}</div>`;$('#go').disabled=false}})}
async function scanView(id){shell('scan');clearInterval(poll);const tick=async()=>{try{const s=await api(`/scans/${id}/status`);
  if(s.status==='COMPLETED'){clearInterval(poll);result(await api('/scans/'+id));return}
  if(s.status==='FAILED'){clearInterval(poll);V(`<h1>Assessment failed</h1><div class="err">${esc(s.error_message||'The assessment could not be completed.')}</div><a class="btn" href="#/scan">Try another domain</a>`);return}
  V(`<h1>Assessment in progress</h1><div class="card" style="max-width:560px"><p><b>${esc(s.current_check||'Preparing assessment')}...</b></p><div class="bar" role="progressbar" aria-valuenow="${s.progress}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(s.progress,4)}%"></i></div><p class="mu sm">${s.progress}% - progress reflects checks completed by the server.</p></div>`)}catch(e){clearInterval(poll);fail(e)}};await tick();poll=setInterval(tick,1500)}
async function targets(){shell('targets');try{const l=await api('/targets');V(`<h1>My targets</h1>${l.length?`<div class="card tw"><table><thead><tr><th>Domain</th><th>Last scanned</th><th>Score</th><th>Scans</th><th></th></tr></thead><tbody>${l.map(t=>`<tr><td>${esc(t.domain)}</td><td>${dt(t.last_scanned)}</td><td>${t.score??'-'}</td><td>${t.scan_count}</td><td class="row"><a class="btn s" href="#/scan?d=${encodeURIComponent(t.domain)}">Scan Again</a><a class="btn g s" href="#/history/${encodeURIComponent(t.domain)}">View History</a><button class="btn d s" data-d="${t.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No targets yet. Domains you assess appear here.</div>'}`);
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>confirmBox('Delete this target and its assessments?',()=>api('/targets/'+b.dataset.d,{method:'DELETE'})))}catch(e){fail(e)}}
async function history(dom){shell('history');try{const l=await api('/scans'+(dom?'?domain='+encodeURIComponent(dom):''));const pts=l.filter(s=>s.status==='COMPLETED').reverse().map(s=>({score:s.overall_score,date:s.created_at,domain:s.domain}));
 V(`<h1>Scan history${dom?': '+esc(dom):''}</h1>${l.length?`<div class="card"><h3>Security score over time</h3>${trend(pts)}</div><div class="card" style="margin-top:1rem">${scanRows(l)}</div>`:'<div class="card empty">No assessments yet.</div>'}`)}catch(e){fail(e)}}
async function reports(){shell('reports');try{const l=await api('/reports');V(`<h1>Reports</h1>${l.length?`<div class="card tw"><table><thead><tr><th>Domain</th><th>Score</th><th>Risk</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>${l.map(r=>`<tr><td>${esc(r.domain)}</td><td>${r.overall_score}</td><td><span class="b ${r.risk_level}">${r.risk_level}</span></td><td>${dt(r.generated_at)}</td><td><span class="b COMPLETED">READY</span></td><td class="row"><a class="btn g s" href="#/scan/${r.scan_id}">View</a><button class="btn s" data-r="${r.id}">Download</button><button class="btn d s" data-x="${r.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No reports yet. Reports are created when an assessment completes.</div>'}`);
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>dlReport(+b.dataset.r).catch(e=>toast(e.message)));document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>confirmBox('Delete this report?',()=>api('/reports/'+b.dataset.x,{method:'DELETE'})))}catch(e){fail(e)}}
function account(k){shell(k);const set=k==='settings';V(`<h1>${set?'Settings':'Profile'}</h1><div class="grid g2"><div class="card"><h3>Profile</h3><div id="e1"></div><label for="nm">Full name</label><input id="nm" value="${esc(user.full_name)}"><label>Email</label><input value="${esc(user.email)}" disabled><p class="mu sm">Member since ${dt(user.created_at)}</p><button class="btn" id="sv">Save name</button></div>${set?`<div class="card"><h3>Security</h3><div id="e2"></div><label for="cp">Current password</label><input id="cp" type="password" autocomplete="current-password"><label for="np">New password</label><input id="np" type="password" minlength="8" autocomplete="new-password"><p><button class="btn" id="pw">Change password</button></p></div><div class="card"><h3>Appearance</h3><button class="btn g" id="th">Switch to ${thm==='dark'?'light':'dark'} mode</button></div><div class="card"><h3>Notifications</h3><p class="mu sm">Email alerts are planned for a future version.</p></div>`:''}</div>`);
 on('#sv','click',async()=>{try{await api('/me',{method:'PUT',body:{full_name:$('#nm').value}});user.full_name=$('#nm').value;$('#e1').innerHTML='<div class="demo">Saved.</div>'}catch(e){$('#e1').innerHTML=`<div class="err">${esc(e.message)}</div>`}});
 on('#pw','click',async()=>{try{await api('/me/password',{method:'POST',body:{current:$('#cp').value,new:$('#np').value}});$('#e2').innerHTML='<div class="demo">Password changed.</div>'}catch(e){$('#e2').innerHTML=`<div class="err">${esc(e.message)}</div>`}});
 on('#th','click',()=>{thm=thm==='dark'?'light':'dark';localStorage.setItem('cr_th',thm);document.documentElement.dataset.theme=thm;account(k)})}
async function demo(){app.innerHTML=`${pnav()}<main class="wrap" style="padding-top:1rem"><div id="view">${sk}</div></main>`;try{result(await api('/demo'),true)}catch(e){fail(e)}}
async function help(){app.innerHTML=`${pnav()}<main class="wrap"><h1>${location.hash==='#/help'?'Help':'About CyberRakshak'}</h1><p class="mu" style="max-width:700px">CyberRakshak checks the public security configuration of a website you are authorized to assess: HTTPS, TLS certificate, security headers, cookies, DNS and email records, server disclosure, robots.txt and security.txt. Findings are scored 0-100 and explained with fixes. Use New Assessment, wait for the live progress to finish, then download the PDF report from the result page or Reports.</p></main>${foot}`}

/* ---------- router ---------- */
async function route(){clearInterval(poll);const [p,...r]=location.hash.slice(2).split('?')[0].split('/'),arg=r.join('/');const priv=['dashboard','scan','targets','reports','history','profile','settings'];
 if(priv.includes(p)){if(!token){location.hash='#/login';return}if(!user){try{user=await api('/me')}catch(e){location.hash='#/login';return}}}
 if(p==='dashboard')dashboard();else if(p==='scan')arg?scanView(arg):scanForm();else if(p==='targets')targets();else if(p==='reports')reports();else if(p==='history')history(decodeURIComponent(arg));else if(p==='profile'||p==='settings')account(p);
 else if(p==='login')authPage(false);else if(p==='register')authPage(true);else if(p==='demo')demo();else if(p==='about'||p==='help')help();else landing();
 if(p==='scan'&&!arg){const d=new URLSearchParams(location.hash.split('?')[1]||'').get('d');if(d)setTimeout(()=>{const i=$('#d');if(i)i.value=d},0)}}
addEventListener('hashchange',route);route();
</script></body></html>
